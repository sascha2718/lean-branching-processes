name = "branchingprocess"
defaultTargets = ["BranchingProcess"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.32.2"

# `BranchingProcess.AxCheck` is covered by the glob, so `lake build` runs it, but it
# is not imported by the root module: `import BranchingProcess` does not drag it in.
[[lean_lib]]
name = "BranchingProcess"
globs = ["BranchingProcess.+"]
